name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:
    paths:
      - '**.php'

jobs:
  mago:
    name: mago ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - fmt --check
          - lint
          - analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom fileinfo filter libxml xmlreader zip gd

      - name: Install dependencies
        uses: ramsey/composer-install@v2

      - name: Run Mago
        run: ./vendor/bin/mago ${{ matrix.command }}
