php-version = "8.1"

[source]
paths = ["src", "tests"]
includes = ["vendor"]
excludes = ["src/Resources/skeleton"]

[formatter]
space-around-concatenation-binary-operator = false
space-before-arrow-function-parameter-list-parenthesis = true
array-table-style-alignment = false
empty-line-before-return = true
method-chain-semicolon-on-next-line = true
preserve-breaking-member-access-chain = true
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true

[linter]
integrations = ["symfony", "phpunit"]

[linter.rules]
assertion-style = { style = "this" }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
kan-defect = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
cyclomatic-complexity = { threshold = 1000, method-threshold = 15 }

[analyzer]
ignore = [
    { code = "interface-instantiation", in = [
        "src/Type/ResolvedDataTableType.php",
        "src/Action/Type/ResolvedActionType.php",
        "src/Column/Type/ResolvedColumnType.php",
        "src/Filter/Type/ResolvedFilterType.php",
        "src/Exporter/Type/ResolvedExporterType.php",
    ] },
    { code = "unsafe-instantiation", in = ["src/Bridge/OpenSpout/Exporter/Type/AbstractOpenSpoutExporterType.php"] },
    { code = "too-many-arguments", in = ["src/Bridge/OpenSpout/Exporter/Type/AbstractOpenSpoutExporterType.php"] },
    { code = "mixed-operand", in = ["src/Query/ArrayProxyQuery.php"] },
]
minimum-fail-level = "warning"
find-overly-wide-return-types = true
